<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💅 茉莉來算算</title>
    <style>
        :root {
            --bg-color: #FAF5F5;
            --card-bg: #FFFFFF;
            --primary-pink: #E8A5A5;
            --accent-rose: #C87575;
            --text-dark: #4A3E3E;
            --text-muted: #8C7A7A;
            --border-color: #F0E2E2;
            --shadow: 0 8px 20px rgba(200, 117, 117, 0.08);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 24px;
        }
        header {
            text-align: center;
            margin-bottom: 12px;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-rose);
            letter-spacing: 1px;
        }
        /* 置頂總金額與複製按鈕組合區塊 (2 : 1) */
        .top-sticky-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 8px;
            position: sticky;
            top: 10px;
            z-index: 10;
            margin-bottom: 20px;
        }
        .total-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            border: 2px solid var(--primary-pink);
            border-radius: 18px;
            padding: 12px 10px;
            text-align: center;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .total-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .total-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-rose);
            line-height: 1.1;
        }
        .btn-reset {
            background: linear-gradient(135deg, #FFF0F0 0%, #FFE5E5 100%);
            color: var(--accent-rose);
            border: 2px solid var(--primary-pink);
            border-radius: 18px;
            padding: 10px 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            width: 100%;
            height: 100%;
        }
        .btn-reset:active {
            transform: scale(0.96);
            background: #FFE0E0;
        }
        .category-block {
            margin-bottom: 20px;
            width: 100%;
        }
        .category-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-rose);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
        }
        /* 統一 2 欄 Grid 嚴格對齊 (使用 minmax 防止溢出) */
        .grid-buttons,
        .extension-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
        }
        .btn-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            width: 100%;
            min-width: 0;
        }
        .btn-item:active {
            transform: scale(0.96);
        }
        /* 已點選高亮樣式 */
        .btn-item.active {
            background: #F7E2E2;
            border: 1.5px solid var(--accent-rose);
            box-shadow: 0 3px 10px rgba(200, 117, 117, 0.2);
        }
        .btn-item.active .btn-name,
        .btn-item.active .btn-price {
            color: var(--accent-rose);
            font-weight: 700;
        }
        .btn-name {
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            transition: color 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .btn-price {
            font-size: 0.8rem;
            color: var(--accent-rose);
            transition: color 0.2s ease;
        }
        /* 延甲與補甲卡片樣式 */
        .ext-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            width: 100%;
            min-width: 0;
        }
        .ext-card.full-width {
            grid-column: 1 / -1;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .ext-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .ext-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            width: 100%;
            min-width: 0;
        }
        .ext-card.full-width .ext-controls {
            width: auto;
            flex: 1;
            justify-content: flex-end;
        }
        .ext-card:not(.full-width) .ext-controls input {
            flex: 1;
            width: 0;
            min-width: 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 4px;
            font-size: 0.82rem;
            text-align: center;
            outline: none;
        }
        .ext-card.full-width .ext-controls input {
            width: 90px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            font-size: 0.85rem;
            text-align: center;
            outline: none;
        }
        .ext-controls input:focus {
            border-color: var(--primary-pink);
        }
        /* 通用輸入框區塊 (手足保養專用) */
        .extension-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .extension-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .extension-item .ext-controls {
            width: auto;
        }
        .extension-item .ext-controls input {
            width: 75px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            font-size: 0.85rem;
            text-align: center;
            outline: none;
        }
        /* 特殊彈性加價 */
        .custom-input-box {
            display: flex;
            gap: 6px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            width: 100%;
        }
        .custom-input-box input {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 6px;
            font-size: 0.82rem;
            outline: none;
            color: var(--text-dark);
        }
        .custom-input-box input[type="text"] { flex: 1.5; min-width: 0; }
        .custom-input-box input[type="number"] { flex: 1; min-width: 0; text-align: center; }
        .btn-ext-add {
            background: var(--accent-rose);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-ext-add:active {
            opacity: 0.85;
        }
        /* 結帳明細區 */
        .cart-section {
            margin-top: 24px;
            width: 100%;
        }
        .cart-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .cart-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            padding: 16px 0;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-info .name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .cart-info .sub {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: #FFF;
            font-size: 1rem;
            color: var(--accent-rose);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .qty-number {
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>💅 茉莉來算算</h1>
    </header>

    <!-- 置頂總金額與複製按鈕組合區塊 (2 : 1) -->
    <div class="top-sticky-container">
        <div class="total-card">
            <div class="total-label">本次應收總金額</div>
            <div class="total-amount" id="grandTotal">NT$ 0</div>
        </div>
        <button class="btn-reset" id="resetBtn">
            <span>📋 複製明細</span>
        </button>
    </div>

    <!-- 各分類區塊 -->
    <div id="categoryContainer"></div>

    <!-- 點選明細 -->
    <div class="cart-section">
        <div class="category-title">🧾 點選明細</div>
        <div class="cart-card" id="cartContainer">
            <div class="cart-empty">尚未選取任何項目</div>
        </div>
    </div>

    <script>
        const categoriesData = [
            {
                title: "💅 手部凝膠指甲",
                items: [
                    { name: "手部晶透建甲", price: 1200 },
                    { name: "手部單色凝膠", price: 1200 },
                    { name: "手部單色貓眼", price: 1600 },
                    { name: "手部雙色貓眼", price: 1700 },
                    { name: "手部單色漸層", price: 1500 },
                    { name: "手部雙色漸層", price: 1700 },
                    { name: "手部璀璨漸層", price: 1400 },
                    { name: "手部優雅法式", price: 1650 }
                ]
            },
            {
                title: "🦶 足部凝膠指甲",
                items: [
                    { name: "足部晶透建甲", price: 1200 },
                    { name: "足部單色凝膠", price: 1200 },
                    { name: "足部單色貓眼", price: 1600 },
                    { name: "足部雙色貓眼", price: 1700 },
                    { name: "足部單色漸層", price: 1500 },
                    { name: "足部璀璨漸層", price: 1400 }

                ]
            },
            {
                title: "✂️ 卸甲護理",
                items: [
                    { name: "本店卸甲續作", price: 300 },
                    { name: "他店卸甲續作", price: 500 },
                    { name: "本店卸延長續作", price: 500 },
                    { name: "他店卸延長續作", price: 700 },
                    { name: "本店單純卸本甲", price: 700 },
                    { name: "他店單純卸本甲", price: 800 },
                    { name: "本店單純卸延長", price: 900 },
                    { name: "他店卸延長延長", price: 1000 },
                    { name: "足部本店單純卸甲", price: 700 },
                    { name: "足部他店單純卸甲", price: 800 }
                ]
            },
            {
                title: "💅 延甲與補甲",
                isExtensionBlock: true,
                items: []
            },
            {
                title: "✨ 加價項目",
                items: [
                    { name: "延甲二次利用 (指)", price: 30 },
                    { name: "裸透感遮游離", price: 150 },
                    { name: "貓眼 (指)", price: 40 },
                    { name: "跳色 (色)", price: 100 },
                    { name: "鏡面粉 (指)", price: 80 },
                    { name: "特殊甲加價", price: 300 },
                    { name: "A級暈染", price: 80 },
                    { name: "B級暈染", price: 120 },
                    { name: "C級暈染", price: 150 },
                    { name: "D級暈染", price: 180 }
                ]
            },
            {
                title: "✏️ 特殊彈性加價",
                isCustomBox: true,
                items: []
            },
            {
                title: "🧴 手足保養",
                hasCareInputs: true,
                items: [
                    { name: "手部兩側硬皮", price: 150 },
                    { name: "足部兩側硬皮", price: 200 },
                    { name: "手部水晶保養", price: 500 },
                    { name: "足部水晶保養", price: 700 },
                    { name: "手部白金保養", price: 800 },
                    { name: "足部白金保養", price: 1000 },
                    { name: "手部黃薔薇保養", price: 1400 },
                    { name: "足部黃薔薇保養", price: 1600 },
                    { name: "手部黑薔薇保養", price: 1750 },
                    { name: "足部黑薔薇保養", price: 1950 }
                ]
            }
        ];

        let cart = [];

        function initCategoryButtons() {
            const container = document.getElementById('categoryContainer');
            if (!container) return;

            container.innerHTML = categoriesData.map((cat, catIdx) => {
                if (cat.isCustomBox) {
                    return `
                        <div class="category-block">
                            <div class="category-title">${cat.title}</div>
                            <div class="custom-input-box">
                                <input type="text" id="customName" placeholder="特殊加價" value="" autocomplete="off">
                                <input type="number" id="customPrice" placeholder="單價 $" inputmode="numeric" autocomplete="off">
                                <input type="number" id="customQty" placeholder="數量" value="1" min="1" inputmode="numeric" autocomplete="off">
                                <button type="button" class="btn-ext-add" id="addCustomBtn">＋ 加入</button>
                            </div>
                        </div>
                    `;
                }

                if (cat.isExtensionBlock) {
                    return `
                        <div class="category-block">
                            <div class="category-title">${cat.title}</div>
                            <div class="extension-grid">
                                <div class="ext-card">
                                    <span class="ext-title">手部延甲 ($150/指)</span>
                                    <div class="ext-controls">
                                        <input type="number" id="extHandQty" placeholder="指數" min="1" inputmode="numeric" autocomplete="off">
                                        <button type="button" class="btn-ext-add" onclick="addExtension('手部延甲', 150, 'extHandQty')">＋ 加入</button>
                                    </div>
                                </div>
                                <div class="ext-card">
                                    <span class="ext-title">足部延甲 ($200/指)</span>
                                    <div class="ext-controls">
                                        <input type="number" id="extFootQty" placeholder="指數" min="1" inputmode="numeric" autocomplete="off">
                                        <button type="button" class="btn-ext-add" onclick="addExtension('足部延甲', 200, 'extFootQty')">＋ 加入</button>
                                    </div>
                                </div>
                                <div class="ext-card full-width">
                                    <span class="ext-title">💅 補甲</span>
                                    <div class="ext-controls">
                                        <input type="number" id="repairNailPrice" placeholder="金額 $" min="0" inputmode="numeric" autocomplete="off">
                                        <button type="button" class="btn-ext-add" onclick="addCustomCare('💅 補甲', 'repairNailPrice')">＋ 加入</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="category-block">
                        <div class="category-title">${cat.title}</div>
                        <div class="grid-buttons">
                            ${cat.items.map((item, itemIdx) => `
                                <div class="btn-item" data-cat="${catIdx}" data-item="${itemIdx}">
                                    <span class="btn-name">${item.name}</span>                                     <span class="btn-price">$${item.price}</span>
                                </div>
                            `).join('')}
                        </div>

                        ${cat.hasCareInputs ? `
                            <div class="extension-box">
                                <div class="extension-item">
                                    <span class="ext-title">🩹 嵌甲護理</span>
                                    <div class="ext-controls">
                                        <input type="number" id="careIngrownPrice" placeholder="金額 $" inputmode="numeric" autocomplete="off">
                                        <button type="button" class="btn-ext-add" onclick="addCustomCare('嵌甲護理', 'careIngrownPrice')">＋ 加入</button>
                                    </div>
                                </div>
                                <div class="extension-item">
                                    <span class="ext-title">🦶 足底柔嫩</span>
                                    <div class="ext-controls">
                                        <input type="number" id="careSolePrice" placeholder="金額 $" inputmode="numeric" autocomplete="off">
                                        <button type="button" class="btn-ext-add" onclick="addCustomCare('足底柔嫩', 'careSolePrice')">＋ 加入</button>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            const customNameInput = document.getElementById('customName');
            if (customNameInput) {
                customNameInput.value = '';
            }

            container.querySelectorAll('.btn-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cIdx = btn.getAttribute('data-cat');
                    const iIdx = btn.getAttribute('data-item');
                    if (categoriesData[cIdx] && categoriesData[cIdx].items[iIdx]) {
                        const item = categoriesData[cIdx].items[iIdx];
                        addItem(item.name, item.price, 1);
                    }
                });
            });

            const addCustomBtn = document.getElementById('addCustomBtn');
            if (addCustomBtn) {
                addCustomBtn.addEventListener('click', addCustomItem);
            }
        }

        function addItem(name, price, qty = 1) {
            const existing = cart.find(i => i.name === name);
            if (existing) {
                existing.qty += qty;
            } else {
                cart.push({ name, price, qty });
            }
            render();
        }

        function addExtension(name, price, inputId) {
            const input = document.getElementById(inputId);
            const qty = parseInt(input.value, 10);
            if (isNaN(qty) || qty <= 0) {
                alert("請輸入正確的指數！");
                return;
            }
            addItem(name, price, qty);
            input.value = '';
        }

        function addCustomCare(name, inputId) {
            const input = document.getElementById(inputId);
            const price = parseFloat(input.value);
            if (isNaN(price) || price <= 0) {
                alert("請輸入有效的金額！");
                return;
            }
            addItem(name, price, 1);
            input.value = '';
        }

        function addCustomItem() {
            const nameInput = document.getElementById('customName');
            const priceInput = document.getElementById('customPrice');
            const qtyInput = document.getElementById('customQty');

            const name = nameInput.value.trim() || "特殊加價";
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value, 10) || 1;

            if (isNaN(price) || price <= 0) {
                alert("請輸入有效的單價金額！");
                return;
            }

            if (isNaN(qty) || qty <= 0) {
                alert("請輸入有效的數量！");
                return;
            }

            addItem(name, price, qty);

            priceInput.value = '';
            qtyInput.value = '1';
            nameInput.value = '';
        }

        function changeQty(name, delta) {
            const item = cart.find(i => i.name === name);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.name !== name);
                }
            }
            render();
        }

        async function copyAndClearCart() {
            if (cart.length === 0) {
                alert("目前算盤內沒有任何項目喔！");
                return;
            }

            let textLines = [];
            let total = 0;

            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                textLines.push(`${item.name}\n${item.price.toLocaleString()}元 × ${item.qty} = ${subtotal.toLocaleString()}元`);
            });

            textLines.push(`\n💰 總金額：NT$ ${total.toLocaleString()}`);
            const finalText = textLines.join('\n');

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(finalText);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = finalText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
             } catch (err) {

            }

            cart = [];
            render();
        }

        function render() {
            const container = document.getElementById('cartContainer');
            const totalEl = document.getElementById('grandTotal');

            document.querySelectorAll('.btn-item').forEach(btn => {
                const cIdx = btn.getAttribute('data-cat');
                const iIdx = btn.getAttribute('data-item');
                if (cIdx !== null && iIdx !== null && categoriesData[cIdx] && categoriesData[cIdx].items[iIdx]) {
                    const item = categoriesData[cIdx].items[iIdx];
                    const isInCart = cart.some(c => c.name === item.name);
                    if (isInCart) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });

            if (cart.length === 0) {
                container.innerHTML = `<div class="cart-empty">尚未選取任何項目</div>`;
                totalEl.innerText = "NT$ 0";
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                return `
                    <div class="cart-item">
                        <div class="cart-info">
                            <div class="name">${item.name}</div>
                            <div class="sub">$${item.price} × ${item.qty} = $${subtotal}</div>
                        </div>
                        <div class="cart-controls">
                            <button class="qty-btn btn-minus" data-name="${item.name}">-</button>
                            <span class="qty-number">${item.qty}</span>
                            <button class="qty-btn btn-plus" data-name="${item.name}">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.btn-minus').forEach(btn => {                btn.addEventListener('click', () => changeQty(btn.getAttribute('data-name'), -1));
            });
            container.querySelectorAll('.btn-plus').forEach(btn => {
                btn.addEventListener('click', () => changeQty(btn.getAttribute('data-name'), 1));
            });

            totalEl.innerText = `NT$ ${total.toLocaleString()}`;
        }

        document.getElementById('resetBtn').addEventListener('click', copyAndClearCart);

        initCategoryButtons();
    </script>
</body>
</html>
